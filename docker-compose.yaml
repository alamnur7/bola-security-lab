
services:

  # Application Database
  postgres-app:
    image: postgres:17-alpine
    container_name: bola-postgres-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - bola_app_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - bola-network


  # Dedicated Keycloak Database
  postgres-keycloak:
    image: postgres:17-alpine
    container_name: bola-postgres-keycloak
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - keycloak_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - bola-network


  # Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: bola-keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --http-port=8080

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: "true"

    ports:
      - "8081:8080"

    depends_on:
      postgres-keycloak:
        condition: service_healthy

    networks:
      - bola-network


# Persistent Storage
volumes:
  bola_app_data:
  keycloak_data:


# Internal Service Network
networks:
  bola-network:
    driver: bridge
